- {client: GitHub Copilot, docs: https://docs.aembit.io/ai-guide/mcp/mcp-server/connect/github-copilot/}
- {client: Visual Studio, docs: https://docs.aembit.io/ai-guide/mcp/mcp-server/connect/visual-studio/}
- {client: MCP Inspector, docs: https://docs.aembit.io/ai-guide/mcp/mcp-server/connect/mcp-inspector/}
related_mcp_products:
  note: >-
    These are Aembit PRODUCTS that govern OTHER parties' MCP traffic. They are not the Aembit
    MCP Server catalogued above and they do not expose Aembit's own API as tools — recorded here
    so the distinction is explicit rather than collapsed into one MCP claim.
  products:
  - name: MCP Identity Gateway
    role: Identity federation and policy enforcement for MCP clients reaching third-party MCP servers; managed or self-hosted.
    docs: https://docs.aembit.io/ai-guide/mcp/identity-gateway/
    supported_servers: [Atlassian, BigQuery, Databricks, FactSet, GitHub, Google Workspace, Kensho, Microsoft Enterprise, Notion]
  - name: MCP Authorization Server
    role: OAuth 2.1 authorization for MCP clients and servers, driven by Aembit Access Policies.
    docs: https://docs.aembit.io/ai-guide/mcp/authorization-server/
