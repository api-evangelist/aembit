- tool: get_workload_events
  category: workload-events
  rest: [get-workload-events]
  rest_paths: [GET /api/v1/workload-events]
  binding: rest
  confidence: high
  inherits_input_schema_from: openapi/aembit-cloud-api-openapi.yml#get-workload-events
