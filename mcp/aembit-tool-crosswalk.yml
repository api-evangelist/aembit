  inherits_input_schema_from: openapi/aembit-cloud-api-openapi.yml#get-audit-logs
  note: >-
    Same audit-log resource. PARAMETER NAMING DIVERGES: the REST operation takes page / per-page /
    filter / order / group-by (all free-text strings with no published grammar), while the MCP
    tool takes page / perPage / orderBy / descending / category / severity plus explicit date
