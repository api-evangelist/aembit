finding: >-
  THE MCP SURFACE IS DELIBERATELY 1.8% OF THE REST SURFACE, AND THAT IS A DESIGN POSITION, NOT A
  GAP. Aembit exposes exactly three read-only observability tools and zero of its 98 mutating
  operations to agents. For a company whose product is governing what non-human identities may
  do, shipping an agent interface that cannot change a policy, create a workload or mint a
  credential is a coherent stance rather than an incomplete implementation — and it is worth
  recording as such rather than scoring it as thin coverage. The counterpart observation is that
  the MCP tools publish CLOSED PARAMETER ENUMS the REST contract does not, so on the three
  resources they share, the agent-facing surface is the better-specified one.
