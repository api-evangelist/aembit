note: >-
  Binds each published Aembit MCP Server tool to the Cloud API operation that backs it. The
  mapping is unusually clean: all three tools are read-only projections of the three reporting
  resource families, and each tool's real input contract is that operation's query parameters.
  Where the tool and the operation disagree on parameter naming or on the closed set of allowed
  values, that divergence is recorded rather than smoothed over — it is the thing an integrator
  needs to know.
