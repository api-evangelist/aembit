standards:
- id: openapi-3.1
  conforms: true
  evidence: 'Both published contracts declare openapi: 3.1.1 (Cloud API, Edge API).'
- id: oauth2
  conforms: false
  evidence: >-
    Aembit's OWN APIs use a bearer API token (http/bearer), not OAuth 2.0 — no oauth2
    securityScheme appears in either contract. Aembit SELLS an OAuth 2.1 MCP Authorization Server
    and an OAuth 2.0 Client Credentials Credential Provider, but those govern customer traffic;
    conforming a provider on a product it sells rather than an interface it exposes would be a
    misattribution.
- id: oidc
  conforms: false
  evidence: >-
    No /.well-known/openid-configuration is served by any Aembit-operated host. The one found at
    trust.aembit.io belongs to SafeBase (issuer https://app.safebase.io/api/mcp). Aembit does
    CONSUME OIDC extensively as a Trust Provider input (OIDC ID Token, GCP identity token,
    GitHub/GitLab ID tokens, Terraform Cloud identity tokens, AWS ALB JWT, GCP IAP JWT).
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use a bespoke GenericResponseDTO envelope ({success, message, id}) served as
