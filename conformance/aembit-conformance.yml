  certifications:
  - {name: SOC 2 Type II, scope: security, availability and confidentiality controls}
  - {name: ISO/IEC 27001:2022, scope: information security management system (ISMS) and risk management}
  supports_customer_regimes:
    note: >-
      Aembit states these as regimes its certifications HELP CUSTOMERS SATISFY, not as its own
      certifications. Recorded with that distinction intact.
    regimes: [HIPAA Security Rule §164.308-312, PCI-DSS Requirement 12, Sarbanes-Oxley IT Controls, FedRAMP (via ISO 27001 / NIST 800-53 alignment)]
  processes: [continuous monitoring, annual third-party SOC 2 Type II and ISO 27001 audits, routine independent penetration testing, RBAC over administrative actions]
