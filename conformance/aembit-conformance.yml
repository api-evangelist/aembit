domain_standard:
  market: Workload identity / non-human identity access management
  declared_in_contract: false
  candidates_checked: [scim, spiffe-workload-api, oauth2-token-exchange-rfc8693, openid-federation]
  finding: >-
    REWARD-ONLY CHECK, HONESTLY UNMET. The workload-identity market's nearest standards are
    SPIFFE/SPIFFE Workload API and OAuth 2.0 Token Exchange (RFC 8693). Aembit supports SPIFFE as
    a documented identity type, but neither contract DECLARES a domain-standard signature — no
    SPIFFE ID scheme in a schema, no urn:ietf:params:* URN, no RFC 8693 grant_type in a token
    endpoint. The Edge API's POST /edge/v1/auth is a token-exchange-shaped operation with a
    bespoke AuthRequest/TokenDTO pair rather than the RFC 8693 shape. No domain-standard
    conformance is asserted, and none is invented to fill the slot.
