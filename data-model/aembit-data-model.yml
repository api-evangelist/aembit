edge_api_model:
  note: The Edge API has no persistent entities; it is a two-step runtime exchange.
  flow:
  - {step: 1, operation: edge-api-auth, input: AuthRequest (attestation evidence for a Trust Provider), output: TokenDTO (OAuth2-style short-lived bearer)}
  - {step: 2, operation: edge-api-get-credentials, input: Edge bearer token + Server Workload host/port, output: credential for the target Server Workload}
