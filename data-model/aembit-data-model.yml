note: >-
  Entity graph derived from the Cloud API's 181 component schemas — $ref links between DTOs and
  UUID id-reference fields. Aembit's model is a policy graph: an Access Policy is the join row
  that binds a Client Workload (who is asking) to a Server Workload (what is being reached),
  through a Trust Provider (how the requester proves identity) and a Credential Provider (what
  credential is minted), optionally narrowed by Access Conditions and Content Security, with
  every entity scoped to a Resource Set.
identifier_conventions:
  primary: externalId
  primary_format: uuid
  primary_note: >-
    Every addressable entity carries BOTH an int32 `id` and a uuid `externalId`. `externalId`
    (34 schemas) is the stable public identifier used in path parameters and cross-entity
    references; the int32 `id` is an internal surrogate that also appears as the response
    identifier inside the GenericResponseDTO error envelope. An integrator should reference
    externalId and treat id as non-durable.
  tenancy: >-
    Every list and mutate operation accepts an optional X-Aembit-ResourceSet header (uuid). The
    Resource Set is the tenancy/least-privilege boundary; omitted, the default Resource Set applies.
  common_audit_fields: [createdAt, modifiedAt, createdBy, modifiedBy, isActive, name, description, tags]
