limit_count: 0
note: >-
  AN HONEST ZERO. Aembit publishes no numeric rate limit — no requests-per-second,
  requests-per-minute or daily quota — for the Cloud API, the Edge API or the MCP Server, and no
  quota is attached to any pricing tier. Throttling demonstrably EXISTS (the Edge API declares a
  429 on both of its operations, and the MCP Server overview says the service rate-limits per
  source IP and per tenant), but the number, the window and the recovery signal are all absent.
  An automated client cannot compute a safe call rate from anything Aembit publishes, and when it
  is throttled it gets no retry hint.
