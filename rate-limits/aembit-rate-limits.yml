gap: >-
  Declaring RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset (RFC 9331 draft shape) or at
  minimum Retry-After on the Edge API's 429, and publishing one number for the Cloud API, would
  close the largest runtime-semantics gap in this profile.
