  finding: >-
    NONE. A case-insensitive search of both OpenAPI contracts for "ratelimit", "rate limit" and
    "retry-after" returns zero matches. No 429 response in either contract declares a headers
    block. This is the single most consequential runtime gap for an agent integration: the
    provider throttles but emits no machine-readable signal about it.
  probe_note: >-
    Not observed live either. Both APIs are tenant-scoped and require a bearer token, so there is
    no unauthenticated response whose headers could be inspected without an Aembit tenant.
