openapi: '3.1.1'
info:
  title: Aembit Cloud API
  version: v1
servers:
  - url: 'https://{tenant}.aembit.io'
    variables:
      tenant:
        default: tenant
        description: Aembit Tenant ID
paths:
  /api/v1/access-conditions:
    get:
      tags:
        - Access Condition
      summary: Get a page of Access Conditions
      description: Retrieve a page of Aembit Access Conditions.
      operationId: get-access-conditions
      parameters:
        - name: X-Aembit-ResourceSet
          in: header
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
        - name: per-page
          in: query
          schema:
            type: integer
            format: int32
            default: 100
        - name: filter
          in: query
          schema:
            type: string
            default: ''
        - name: order
          in: query
          schema:
            type: string
            default: ''
        - name: group-by
          in: query
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Page of Access Conditions
          content:
            application/json:
              schema:
                description: Page of Access Conditions
                $ref: '#/components/schemas/AccessConditionDTOAccessConditionListDTO'
        '400':
          description: Bad Request
        '401':
          description: Not Authenticated
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                description: DTO for a Generic API Response
                $ref: '#/components/schemas/GenericResponseDTO'
    post:
      tags:
        - Access Condition
      summary: Create an Access Condition
      description: Create an Aembit Access Condition which can then be associated with an Access Policy.
      operationId: post-access-condition
      parameters:
        - name: X-Aembit-ResourceSet
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        description: AccessConditionDTO
        content:
          application/json:
            schema:
              description: DTO of an individual Access Condition for enforcement during Access Policy evaluation
              $ref: '#/components/schemas/AccessConditionDTO'
      responses:
        '201':
          description: Successfully created Access Condition
          content:
            application/json:
              schema:
                description: DTO of an individual Access Condition for enforcement during Access Policy evaluation
                $ref: '#/components/schemas/AccessConditionDTO'
        '400':
          description: Bad Request
        '401':
          description: Not Authenticated
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                description: DTO for a Generic API Response
                $ref: '#/components/schemas/GenericResponseDTO'
    put:
      tags:
        - Access Condition
      summary: Update a single Access Condition
      description: Update a specific Access Condition identified by its ID.
      operationId: put-access-condition
      parameters:
        - name: X-Aembit-ResourceSet
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        description: AccessConditionDTO
        content:
          application/json:
            schema:
              description: DTO of an individual Access Condition for enforcement during Access Policy evaluation
              $ref: '#/components/schemas/AccessConditionDTO'
      responses:
        '200':
          description: Successfully updated Access Condition
          content:
            application/json:
              schema:
                description: DTO of an individual Access Condition for enforcement during Access Policy evaluation
                $ref: '#/components/schemas/AccessConditionDTO'
        '400':
          description: Bad Request
        '401':
          description: Not Authenticated
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                description: DTO for a Generic API Response
                $ref: '#/components/schemas/GenericResponseDTO'
  '/api/v1/access-conditions/{id}':
    get:
      tags:
        - Access Condition
      summary: Get the identified Access Condition
      description: Get the Access Condition identified by its ID.
      operationId: get-access-condition
      parameters:
        - name: id
          in: path
          description: ID of Access Condition
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Aembit-ResourceSet
          in: header
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Access Condition
