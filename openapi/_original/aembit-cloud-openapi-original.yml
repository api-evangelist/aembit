      allOf:
        - $ref: '#/components/schemas/CredentialProviderIntegrationDTO'
        - required:
            - roleArn
          type: object
          properties:
            roleArn:
              minLength: 1
              pattern: '^arn:aws:iam::\d{12}:role/[\w+=,.@/-]+$'
              type: string
              description: ARN of the AWS IAM Role to assume for access
            lifetimeInSeconds:
              maximum: 43200
              minimum: 900
              type: integer
              description: 'Lifetime of the access credentials in seconds, default is 3600 seconds (1 hour)'
              format: int32
            fetchSecretArns:
              type: boolean
              description: Indicates whether to fetch and populate the ARNs of secrets on AWS Secrets Manager Value Credential Provider UI
          additionalProperties: false
      description: DTO for AWS IAM Role Credential Provider Integration
    AzureEntraFederationCredentialProviderIntegrationDTO:
      allOf:
        - $ref: '#/components/schemas/CredentialProviderIntegrationDTO'
        - required:
            - audience
            - azureTenant
            - clientId
            - keyVaultName
            - subject
          type: object
          properties:
            audience:
              minLength: 1
              pattern: ^\S+$
              type: string
              description: Audience of the federated OIDC token to authenticate against Azure Entra ID
            subject:
              minLength: 1
              type: string
              description: Subject of the federated OIDC token to authenticate against Azure Entra ID
            azureTenant:
              minLength: 1
              pattern: '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
              type: string
              description: Tenant ID of the Azure Entra ID to authenticate against Azure Key Vault
            clientId:
              minLength: 1
              pattern: '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
              type: string
              description: Client ID of the Azure application to authenticate against Azure Key Vault
            keyVaultName:
              minLength: 1
              pattern: '^[a-zA-Z](?!.*--)[a-zA-Z0-9-]{1,22}[a-zA-Z0-9]$'
              type: string
              description: Name of the Azure Key Vault to fetch secrets from
            fetchSecretNames:
              type: boolean
              description: Indicates whether to fetch and populate the names of secrets on Azure Key Vault Value Credential Provider UI
          additionalProperties: false
      description: Individual Credential Provider Integration
