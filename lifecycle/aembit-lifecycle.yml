versioning:
  scheme: uri-path
  current: v1 with a v2 line for four resource families
  docs: https://docs.aembit.io/dev-guide/api/
  note: >-
    info.version on both contracts reads "v1", while the Cloud API paths carry /api/v1/,
    /api/v2/ and one /api/alpha/ prefix. Version selection is per-resource, not per-API: a
    client can be on v2 Access Policies and v1 Client Workloads at the same time.
  v2_families: [Access Policy, Access Condition, Credential Provider, Integration]
  alpha_surface:
    path: /api/alpha/server-workload-drafts/{id}
    note: >-
      The only alpha-prefixed operation, and the ONLY operation in 167 with no operationId and no
      summary. It is published in the contract with no stability statement attached.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecated_flag_used: false
  signal: tag-naming
  evidence: >-
    Aembit signals deprecation by NAMING THE TAG, not by marking the operation. Two tags read
    "Access Policy (Deprecated)" (8 operations) and "Credential Provider (Deprecated)" (8
    operations), each with a v2 successor tag. But `deprecated: true` is set on ZERO of 165
    Cloud API operations, no Sunset or Deprecation response header appears anywhere, and no
    removal date, migration guide URL or support window is published for either family.
  machine_readability: >-
    A tooling client that reads the OpenAPI `deprecated` flag — which is what every code
    generator and linter does — will not see any of this. The deprecation is human-readable only.
  gap: >-
    Setting `deprecated: true` on the 16 affected operations would be a one-line change per
    operation and would make the v1 to v2 migration visible to every generated SDK.
