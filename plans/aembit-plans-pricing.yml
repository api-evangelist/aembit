limits_attached_to_tier:
  note: >-
    Event log retention is the sharpest tier boundary and it is directly relevant to the API:
    24 hours on both free tiers and on Workloads Teams, 7 days on Agentic AI Teams, custom on
    Enterprise. The Cloud API reporting endpoints and all three MCP Server tools read that same
    event store, so on a Starter or Workloads Teams tenant get_audit_logs, get_auth_events and
    get_workload_events can only return the last 24 hours regardless of the spanLastDays
    parameter they accept (which defaults to 30). Log Streams to S3, GCS, Splunk or CrowdStrike
    are the documented path to longer retention.
  conditional_access: Enterprise only, on both lines.
observations:
  free_tier: true
  free_tier_note: >-
    Both lines have a genuinely self-serve free tier reachable without a sales call
    (https://useast2.aembit.io/signup), which is also the practical evaluation environment for
    the API — see sandbox/aembit-sandbox.yml.
  api_access_gating: >-
    The pricing page does not gate API, CLI, SDK or Terraform access behind a tier. No published
    rate limit or API call quota is attached to any tier.
  transparency: >-
    List pricing is published for four of six tiers with named unit prices — better than the
    contact-sales-only norm in this category.
