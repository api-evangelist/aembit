apis:
- name: Aembit Cloud API
  description: The Aembit Cloud API is the management and control plane contract for the Aembit platform.
    It exposes 165 operations across 74 paths for Access Policies, Access Conditions, Client and Server
    Workloads, Credential Providers, Trust Providers, Trust Provider Secrets, Content Security, Resource
    Sets, Roles, Users, SSO Identity Providers, Sign-On Policies, Integrations, Discovery Integrations,
    Log Streams, Certificate Authorities, Routing, Agent Controllers, and the Audit Log, Authorization
    Event and Workload Event reporting surfaces. Authentication is a bearer API token issued from the
    Aembit Admin UI; the host is tenant-scoped.
  humanURL: https://docs.aembit.io/dev-guide/api/cloud/api-reference-cloud/
  baseURL: https://{tenant}.aembit.io
  tags:
  - Access Management
  - Workload Identity
  - Administration
  properties:
  - type: OpenAPI
    url: openapi/_original/aembit-cloud-openapi-original.yml
  - type: Overlay
    url: overlays/aembit-cloud-overlay.yaml
  - type: Documentation
    url: https://docs.aembit.io/dev-guide/api/cloud/
  - type: APIReference
    url: https://docs.aembit.io/dev-guide/api/cloud/api-reference-cloud/
- name: Aembit Edge API
  description: The Aembit Edge API is the workload-facing runtime contract. Two operations let a Client
    Workload bootstrap a session by presenting attestation evidence to a configured Trust Provider (POST
    /edge/v1/auth) and then retrieve a short-lived credential for a Server Workload (POST /edge/v1/credentials).
    It is the contract the Aembit Edge SDKs and the Aembit CLI wrap, and the path applications use when
    they cannot run Agent Proxy.
  humanURL: https://docs.aembit.io/dev-guide/api/edge/api-reference-edge/
  baseURL: https://{tenant}.aembit.io
  tags:
  - Workload Identity
  - Authentication
  - Credentials
  properties:
  - type: OpenAPI
    url: openapi/_original/aembit-edge-openapi-original.yml
  - type: Overlay
    url: overlays/aembit-edge-overlay.yaml
  - type: Documentation
    url: https://docs.aembit.io/dev-guide/api/edge/
  - type: APIReference
    url: https://docs.aembit.io/dev-guide/api/edge/api-reference-edge/
  - type: SDKs
    url: https://docs.aembit.io/dev-guide/sdk/edge/
- name: Aembit MCP Server
  description: A first-party hosted Model Context Protocol server that gives AI agents and MCP clients
    read-only access to a tenant's Aembit event logs. Three tools — get_audit_logs, get_auth_events and
    get_workload_events — expose the same audit, authorization-event and workload-event data as the Cloud
    API reporting endpoints, with filtering, ordering and pagination. Authentication is an Aembit API
    token as a bearer, optionally scoped with an X-Aembit-ResourceSet header. The server is read-only
    by design and must be enabled per tenant.
  humanURL: https://docs.aembit.io/ai-guide/mcp/mcp-server/
  baseURL: https://{tenantId}.mcp.useast2.aembit.io/mcp
  tags:
  - Model Context Protocol
  - Agentic AI
  - Audit
