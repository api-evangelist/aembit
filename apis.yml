apis:
- name: Aembit MCP Server
  description: >-
    A first-party hosted Model Context Protocol server that gives AI agents and MCP clients read-only
    access to a tenant's Aembit event logs. Three tools — get_audit_logs, get_auth_events and get_workload_events
    — expose the same audit, authorization-event and workload-event data as the Cloud API reporting endpoints,
    with filtering, ordering and pagination. Authentication is an Aembit API token as a bearer, optionally
    scoped with an X-Aembit-ResourceSet header. The server is read-only by design and must be enabled
    per tenant.
  humanURL: https://docs.aembit.io/ai-guide/mcp/mcp-server/
  baseURL: https://{tenantId}.mcp.useast2.aembit.io/mcp
  tags:
  - MCP
  - Agentic AI
  - Audit
  tags_raw:
  - Model Context Protocol
  - Agentic AI
  - Audit
