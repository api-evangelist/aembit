aid: aembit
name: Aembit
description: Aembit is a Workload Identity and Access Management (Workload IAM) platform for non-human
  identities — AI agents, applications, microservices, CI/CD pipelines, scripts and service accounts.
  Instead of long-lived, hard-coded secrets, Aembit cryptographically attests a workload against a Trust
  Provider (AWS, Azure, GCP, GitHub Actions, GitLab, Kubernetes, Terraform Cloud, OIDC, SPIFFE, Kerberos),
  evaluates an Access Policy with optional conditional-access signals from CrowdStrike and Wiz, and injects
  a short-lived credential just-in-time so the application never stores one. The platform is delivered
  as a SaaS control plane (Aembit Cloud) plus a distributed enforcement layer (Aembit Edge — Agent Proxy,
  Agent Injector, AWS Lambda extension, CLI and Edge SDKs). Aembit publishes two OpenAPI 3.1.1 contracts
  — the Aembit Cloud API for managing every platform resource and the Aembit Edge API for workload authentication
  and credential retrieval — alongside a hosted, read-only MCP Server for querying audit, authorization
  and workload events, an MCP Identity Gateway and an MCP Authorization Server for governing AI-agent
  access to MCP servers.
