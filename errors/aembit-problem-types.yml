format: vendor-envelope
format_note: 'NOT RFC 9457. Neither contract uses application/problem+json anywhere. Every documented
  error body is the same bespoke GenericResponseDTO envelope served as application/json: {success: boolean,
  message: string|null, id: integer}. `message` carries the human-readable reason and `id` is described
  as a ''Unique identifier of the API response'' — an int32, not a stable, documented error CODE, so there
  is no enumerable machine-readable error taxonomy to catalogue. An agent can branch on HTTP status and
  on the free-text `message` string only.'
envelope:
  schema: GenericResponseDTO
  media_type: application/json
  fields:
    success: boolean — False on failure
    message: string|null — why the call failed
    id: int32 — response identifier
error_code_registry:
  published: false
  note: No numbered or symbolic error-code registry is published for the Cloud or Edge API. The only documented
    error-code list on the docs site belongs to the MCP Authorization Server product (https://docs.aembit.io/ai-guide/mcp/authorization-server/reference-mcp-auth-server/),
    which governs customer MCP traffic rather than Aembit's own REST surface.
